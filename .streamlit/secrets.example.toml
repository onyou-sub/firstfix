# 이 파일을 .streamlit/secrets.toml로 복사하고 password_hash를 바꾸세요.
# 해시 만들기: uv run python scripts/make_password_hash.py
# secrets.toml은 .gitignore에 들어 있어 저장소에 올라가지 않습니다.
# 데모용: 계정에 demo_password = "<비밀번호>"를 넣으면 로그인 화면 옆에 아이디·비밀번호가 안내됩니다.
#        실제 운영에서는 넣지 마세요 (누구나 로그인할 수 있게 됩니다).

[auth.users.admin]
name = "설비보전 관리자"
password_hash = "<bcrypt 해시>"
role = "admin"
allow_dev = true

# 팀 작업자 (팀별 1명). 자기 팀 작업만 보고 처리할 수 있다.
[auth.users.team1]
name = "1팀 작업자"
password_hash = "<bcrypt 해시>"
role = "worker"
team = "1팀"
allow_dev = false

[auth.users.team2]
name = "2팀 작업자"
password_hash = "<bcrypt 해시>"
role = "worker"
team = "2팀"
allow_dev = false

[auth.users.team3]
name = "3팀 작업자"
password_hash = "<bcrypt 해시>"
role = "worker"
team = "3팀"
allow_dev = false
